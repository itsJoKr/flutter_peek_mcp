<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">How flutter_peek_mcp works</title>
  <desc id="desc">The Flutter app sends console output and HTTP traffic through the Dart VM service to flutter_peek_mcp, which serves them to the AI agent over MCP (stdio).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="229" rx="18" fill="#161b22" stroke="#30363d"/>
  <rect x="28" y="28" width="290" height="174" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="28" y="28" width="290" height="6" rx="3" fill="#58a6ff"/>
  <text x="50" y="66" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Flutter app</text>
  <text x="50" y="86" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">debug or profile mode</text>
  <text x="50" y="122" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#e6edf3">print / debugPrint</text>
  <text x="50" y="148" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#e6edf3">dart:developer log()</text>
  <text x="50" y="174" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#e6edf3">HttpClient (Dio, http, …)</text>
  <rect x="506" y="70.0" width="190" height="90" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="506" y="70.0" width="190" height="6" rx="3" fill="#3fb950"/>
  <text x="601.0" y="123" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="600" fill="#e6edf3">flutter_peek_mcp</text>
  <rect x="780" y="70.0" width="156" height="90" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="780" y="70.0" width="156" height="6" rx="3" fill="#f0883e"/>
  <text x="858.0" y="117" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3">AI agent</text>
  <text x="858.0" y="137" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">Claude Code, Cursor, …</text>
  <path d="M324 115 L500 115" stroke="#6e7681" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="412.0" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">VM service</text>
  <text x="412.0" y="137" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">Stdout · Logging</text>
  <text x="412.0" y="153" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">HTTP profile</text>
  <path d="M702 115 L774 115" stroke="#6e7681" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="738.0" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6edf3">MCP</text>
  <text x="738.0" y="137" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1">stdio</text>
</svg>
