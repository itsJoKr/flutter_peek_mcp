  <rect x="50" y="176.0" width="226" height="40" rx="9" fill="#0c2d6b" stroke="#58a6ff" stroke-opacity="0.35"/>
  <text x="64" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">log()</text>
  <text x="64" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1">dart:developer, with error + stack trace</text>
  <rect x="50" y="234.0" width="226" height="40" rx="9" fill="#0c2d6b" stroke="#58a6ff" stroke-opacity="0.35"/>
  <text x="64" y="258.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">Dio · http · HttpClient</text>
