<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">How flutter_peek_mcp works</title>
  <desc id="desc">The Flutter app writes console output and HTTP traffic to the Dart VM service. flutter_peek_mcp reads the Stdout, Stderr and Logging streams and the HTTP profile, keeps them in buffers, and serves them to the AI agent as MCP tools over stdio. flutter run writes the VM service URI to a file, which flutter_peek_mcp reads to find the app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1119" height="429" rx="18" fill="#161b22" stroke="#30363d"/>
  <rect x="32" y="32" width="262" height="268" rx="14" fill="#0d1117" stroke="#30363d"/>
