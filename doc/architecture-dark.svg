  <text x="52" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">debug or profile mode · no changes</text>
  <rect x="50" y="118.0" width="226" height="40" rx="9" fill="#0c2d6b" stroke="#58a6ff" stroke-opacity="0.35"/>
